<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Little bunnies hopping in a breezy field</title>
  <desc id="desc">Several tiny rabbits hop among soft grass and little wildflowers under a pale sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf7fb"/><stop offset="1" stop-color="#f7fbf0"/></linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c8e8b6"/><stop offset="1" stop-color="#98ce89"/></linearGradient>
    <g id="rabbit">
      <g fill="#faf0df" stroke="#acb8a7" stroke-width=".85" stroke-linejoin="round">
        <path d="M14.8-11.2Q11.8-20.9 14.8-24.6Q18-26.1 18.5-17.8L18.4-10.4Z"/>
        <path d="M17.4-10.5Q17-19.6 20.7-21.1Q23.1-20.4 21.1-13.2L19.8-9.4Z"/>
        <path d="M15.3-13.3Q14.2-19.4 15.1-22.2" fill="none" stroke="#e3a1af" stroke-width="1" stroke-linecap="round"/>
        <path d="M2.1-5.4Q1.7-9.5 5.7-10.4Q9.7-11.7 13.1-9.7Q17-8.4 17.8-5.3Q18.2-2.7 14.1-2.1L6.2-2Q2.1-2.1 2.1-5.4Z"/>
        <ellipse cx="3.2" cy="-5.2" rx="2.1" ry="2.2" fill="#fff8ec"/>
        <ellipse cx="8.5" cy="-2.1" rx="2.5" ry="1.1"/>
        <ellipse cx="14.2" cy="-2.1" rx="2.2" ry=".95"/>
        <circle cx="17.4" cy="-9.3" r="3.8"/>
      </g>
      <circle cx="18.7" cy="-9.7" r=".58" fill="#554e4a"/>
      <circle cx="19" cy="-9.9" r=".2" fill="#fff"/>
      <ellipse cx="16.4" cy="-7.8" rx=".8" ry=".45" fill="#e9aab6"/>
      <path d="M19.6-7.6l1.1.2" fill="none" stroke="#aa8586" stroke-width=".55" stroke-linecap="round"/>
      <circle cx="1.8" cy="-5.8" r="2" fill="#faf0df" stroke="#acb8a7" stroke-width=".7"/>
    </g>
    <style>
      .cloud { animation: cloud-drift 25s ease-in-out infinite alternate; }
      .c2 { animation-duration: 34s; animation-delay: -13s; }
      .bunny { animation: hop 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .b2 { animation-delay: -.9s; animation-duration: 3.3s; }
      .b3 { animation-delay: -1.7s; animation-duration: 2.7s; }
      .b4 { animation-delay: -2.2s; animation-duration: 3.5s; }
      .b5 { animation-delay: -.45s; animation-duration: 3.1s; }
      .b6 { animation-delay: -1.35s; animation-duration: 3.4s; }
      .b7 { animation-delay: -2.55s; animation-duration: 3.15s; }
      .grass { animation: sway 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .g2 { animation-delay: -1.2s; animation-duration: 4.1s; }
      .g3 { animation-delay: -.65s; animation-duration: 3.7s; }
      .breeze { animation: breeze 7s ease-in-out infinite; }
      .br2 { animation-delay: -3.2s; animation-duration: 8.5s; }
      @keyframes cloud-drift { from { transform: translateX(-8px); } to { transform: translateX(14px); } }
      @keyframes breeze { 0%,100% { transform: translateX(-4px); opacity: .2; } 50% { transform: translateX(9px); opacity: .7; } }
      @keyframes hop {
        0%, 56%, 100% { transform: translate(0,0) scale(1,1); }
        7% { transform: translate(0,1px) scale(1.09,.84); }
        18% { transform: translate(1px,-5px) scale(.95,1.08); }
        30% { transform: translate(3px,-8px) scale(.97,1.04); }
        42% { transform: translate(4px,0) scale(1.08,.88); }
        49% { transform: translate(4px,0) scale(1,1); }
      }
      @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
      @media (prefers-reduced-motion: reduce) { .cloud,.bunny,.grass,.breeze { animation: none !important; } }
    </style>
  </defs>
  <rect width="900" height="180" rx="12" fill="url(#sky)"/>
  <circle cx="791" cy="30" r="13" fill="#ffe8ae" opacity=".85"/>
  <g class="cloud" fill="#fff" opacity=".86"><ellipse cx="123" cy="34" rx="24" ry="7"/><circle cx="113" cy="30" r="8"/><circle cx="129" cy="28" r="11"/><circle cx="143" cy="33" r="6"/></g>
  <g class="cloud c2" fill="#fff" opacity=".72"><ellipse cx="590" cy="48" rx="19" ry="5.5"/><circle cx="582" cy="45" r="6"/><circle cx="595" cy="42" r="8"/></g>
  <g class="breeze" fill="none" stroke="#a5cdc2" stroke-width="1.5" stroke-linecap="round"><path d="M232 64q11-5 22 0t21-1"/><path d="M260 73q7-3 14 0"/><path d="M657 67q10-5 20 0t17-1"/></g>
  <g class="breeze br2" fill="none" stroke="#a5cdc2" stroke-width="1.3" stroke-linecap="round"><path d="M459 41q9-4 18 0t16-1"/></g>
  <path d="M0 111Q94 81 183 103T365 96T542 100T717 91T900 98V180H0Z" fill="#d9edca"/>
  <path d="M0 129Q120 101 235 121T442 114T650 117T900 111V180H0Z" fill="#c4e4ae"/>
  <path d="M0 143Q123 125 238 138T455 132T674 137T900 128V180H0Z" fill="url(#meadow)"/>

  <!-- Little rabbits at different depths; the grass hides their feet and part of their bodies. -->
  <g transform="translate(97 155) scale(.72)"><g class="bunny"><use href="#rabbit"/></g></g>
  <g transform="translate(247 151) scale(.84)"><g class="bunny b2"><use href="#rabbit"/></g></g>
  <g transform="translate(401 158) scale(.64)"><g class="bunny b3"><use href="#rabbit"/></g></g>
  <g transform="translate(549 152) scale(.88)"><g class="bunny b4"><use href="#rabbit"/></g></g>
  <g transform="translate(635 156) scale(.56)"><g class="bunny b5"><use href="#rabbit"/></g></g>
  <g transform="translate(700 157) scale(.72)"><g class="bunny b6"><use href="#rabbit"/></g></g>
  <g transform="translate(823 151) scale(.78)"><g class="bunny b7"><use href="#rabbit"/></g></g>

  <g stroke="#78b578" stroke-width="1.15" stroke-linecap="round" fill="none"><path d="M59 151v-10m0 7-3-3m3 5 4-3"/><path d="M181 155v-9m0 6-3-3m3 4 4-3"/><path d="M358 149v-8m0 5-3-3m3 4 4-3"/><path d="M629 154v-9m0 6-3-3m3 4 4-3"/><path d="M877 151v-10m0 7-3-3m3 4 4-3"/></g>
  <g fill="#fff7fc"><circle cx="59" cy="140" r="2.3"/><circle cx="56.7" cy="138" r="1.7"/><circle cx="61.5" cy="138" r="1.7"/><circle cx="181" cy="145" r="2"/><circle cx="179" cy="143" r="1.5"/><circle cx="183" cy="143" r="1.5"/><circle cx="358" cy="140" r="2"/><circle cx="356" cy="138" r="1.5"/><circle cx="360" cy="138" r="1.5"/><circle cx="629" cy="145" r="2"/><circle cx="627" cy="143" r="1.5"/><circle cx="631" cy="143" r="1.5"/><circle cx="877" cy="140" r="2"/><circle cx="875" cy="138" r="1.5"/><circle cx="879" cy="138" r="1.5"/></g>

  <g fill="none" stroke-linecap="round">
    <g class="grass" stroke="#69b164" stroke-width="1.8"><path d="M22 180q-3-15-9-22M22 180q6-17 12-22M22 180q-1-11-8-13M97 180q-2-26 2-31M106 180q-1-21 6-25M133 180q-4-18-11-23M133 180q5-14 12-18M220 180q-2-22-9-32M229 180q4-20 10-26"/></g>
    <g class="grass g2" stroke="#5ca65e" stroke-width="2"><path d="M250 180q-2-23 2-27M259 180q0-22 8-25M292 180q-3-17-11-22M292 180q5-20 13-26M379 180q-4-19-12-24M379 180q5-14 11-18M401 180q-1-26 2-30M410 180q4-21 11-23M463 180q-4-18-11-23M463 180q6-18 14-22"/></g>
    <g class="grass g3" stroke="#68b363" stroke-width="1.9"><path d="M542 180q-2-25 4-30M551 180q1-23 8-26M590 180q-4-17-11-23M590 180q5-16 13-21M657 180q-3-16-10-21M657 180q6-18 13-23M695 180q-1-25 5-30M704 180q4-21 11-24M758 180q-4-18-12-23M758 180q5-17 13-21"/></g>
    <g class="grass" stroke="#5ba65e" stroke-width="2"><path d="M817 180q-1-27 5-31M829 180q4-22 12-25M854 180q-4-17-12-22M854 180q6-16 13-21M891 180q-3-15-9-20"/></g>
  </g>
  <path d="M0 168Q115 162 220 170T430 167T660 170T900 164V180H0Z" fill="#9bd08a" opacity=".54"/>
</svg>