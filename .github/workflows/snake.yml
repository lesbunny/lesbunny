name: Generate GitHub Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lesbunny
          outputs: |
            dist/github-pacman.svg
            dist/github-pacman-dark.svg?palette=github-dark

      - name: Replace the snake with animated Pac-Man and roaming ghosts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pacman = """<g class="s s0 pacmanRoute">
            <g class="pacmanFacing">
              <path class="pacmanBody" fill="#ffdc28" stroke="#b77c00" stroke-width="0.8" d="M 8 8 L 14.8 3 A 7.7 7.7 0 1 0 14.8 13 Z">
                <animate attributeName="d" dur="0.30s" repeatCount="indefinite" calcMode="linear"
                  values="M 8 8 L 14.8 3 A 7.7 7.7 0 1 0 14.8 13 Z;M 8 8 L 15.4 7.4 A 7.4 7.4 0 1 0 15.4 8.6 Z;M 8 8 L 14.8 3 A 7.7 7.7 0 1 0 14.8 13 Z"/>
              </path>
              <circle cx="9.5" cy="3.9" r="0.85" fill="#211526"/>
              <animateTransform attributeName="transform" type="rotate" dur="14.5s" repeatCount="indefinite" calcMode="discrete"
                keyTimes="0;.0069;.1034;.1172;.1655;.1862;.2483;.2621;.3379;.3586;.3793;.4138;.4621;.4828;.4897;.4966;.5034;.5379;.5448;.5655;.5724;.5931;.8276;.8345;.8414;.8483;.8966;.9172;.9241;.931;.9517;.9586;1"
                values="90 8 8;0 8 8;90 8 8;0 8 8;90 8 8;0 8 8;-90 8 8;0 8 8;90 8 8;0 8 8;-90 8 8;0 8 8;90 8 8;0 8 8;90 8 8;0 8 8;-90 8 8;180 8 8;90 8 8;180 8 8;90 8 8;180 8 8;-90 8 8;180 8 8;-90 8 8;180 8 8;-90 8 8;180 8 8;-90 8 8;180 8 8;-90 8 8;180 8 8"/>
            </g>
          </g>"""

          def ghost(route_name, route_values, color="#2121de"):
              return f"""<g class="{route_name}">
                <animateTransform attributeName="transform" type="translate" dur="14.5s" repeatCount="indefinite" calcMode="linear" values="{route_values}"/>
                <g>
                  <path d="M1.5 13.5V6.7a5.5 5.5 0 0 1 11 0v6.8l-2.75-2-2.75 2-2.75-2z" fill="{color}" stroke="#11115f" stroke-width="0.75" stroke-linejoin="round"/>
                  <path d="M2 13.4 L4.7 11.4 L7.4 13.4 L10.1 11.4 L12.5 13.2" fill="none" stroke="{color}" stroke-width="1.3" stroke-linejoin="round"/>
                  <circle cx="5" cy="6.5" r="1.7" fill="#fff"/>
                  <circle cx="9.2" cy="6.5" r="1.7" fill="#fff"/>
                  <circle cx="5.5" cy="6.5" r=".72" fill="#14144d"/>
                  <circle cx="9.7" cy="6.5" r=".72" fill="#14144d"/>
                  <animateTransform attributeName="transform" type="translate" additive="sum" dur="0.36s" repeatCount="indefinite" values="0,0;0,-0.45;0,0"/>
                </g>
              </g>"""

          ghosts = [
            ghost("blueGhostOne", "224,0;400,0;400,32;560,32;560,80;736,80;736,48;640,48;640,16;352,16;352,64;224,64;224,0"),
            ghost("blueGhostTwo", "800,96;800,48;704,48;704,0;512,0;512,32;384,32;384,80;256,80;256,48;112,48;112,96;800,96"),
            ghost("blueGhostThree", "80,32;208,32;208,80;400,80;400,48;528,48;528,96;688,96;688,64;816,64;816,16;592,16;80,32"),
          ]

          for path in Path("dist").glob("github-pacman*.svg"):
              svg = path.read_text(encoding="utf-8")
              outline = "#a7c5b3" if path.name.endswith("-dark.svg") else "#789b86"

              # Add inline outlines so the green activity dots remain visible regardless of CSS support.
              svg, cells = re.subn(
                  r'(<rect class="c[^"]*")',
                  lambda m: m.group(1) + f' stroke="{outline}" stroke-width="1.05" stroke-opacity="0.9"',
                  svg,
              )
              if cells < 100:
                  raise SystemExit(f"Expected hundreds of contribution dots in {path}; found {cells}")

              # The original leading snake segment is replaced by Pac-Man. The remaining snake segments are removed.
              svg, head_count = re.subn(r'<rect class="s s0"[^>]*/>', lambda _m: pacman, svg, count=1)
              if head_count != 1:
                  raise SystemExit(f"Could not locate the original moving head in {path}")
              svg, tail_count = re.subn(r'<rect class="s s[123]"[^>]*/>', "", svg)
              if tail_count != 3:
                  raise SystemExit(f"Expected to remove 3 trailing snake segments in {path}; removed {tail_count}")

              if not svg.endswith("</svg>"):
                  raise SystemExit(f"Unexpected SVG structure in {path}")
              svg = svg[:-6] + "".join(ghosts) + "</svg>"
              path.write_text(svg, encoding="utf-8")
              print(f"Built {path}: {cells} green dots, one chomping Pac-Man, and 3 roaming blue ghosts")
          PY

      - name: Publish Pac-Man animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
