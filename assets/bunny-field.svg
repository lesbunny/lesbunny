<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">A little bunny hopping through a breezy field</title>
  <desc id="desc">A tiny cream bunny hops among soft green grass, rolling hills, flowers, and gentle breeze lines under a pale sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#f5fbf4"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e2aa"/>
      <stop offset="1" stop-color="#91cd87"/>
    </linearGradient>
    <style>
      .cloud { animation: cloud-drift 18s ease-in-out infinite alternate; }
      .cloud.second { animation-duration: 23s; animation-delay: -8s; }
      .breeze { animation: breeze-drift 6s ease-in-out infinite; }
      .breeze.two { animation-delay: -2.5s; animation-duration: 7.5s; }
      .bunny { animation: little-hops 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .ears { animation: ear-bob 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .grass { animation: grass-sway 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .grass.delay { animation-delay: -1.4s; animation-duration: 4s; }
      @keyframes cloud-drift { from { transform: translateX(-8px); } to { transform: translateX(16px); } }
      @keyframes breeze-drift { 0%,100% { transform: translateX(-5px); opacity: .35; } 50% { transform: translateX(12px); opacity: .8; } }
      @keyframes little-hops {
        0%, 100% { transform: translate(0,0); }
        10% { transform: translate(5px,-11px); }
        20% { transform: translate(10px,0); }
        30% { transform: translate(15px,-12px); }
        40% { transform: translate(20px,0); }
        56% { transform: translate(20px,0); }
        66% { transform: translate(15px,-10px); }
        76% { transform: translate(10px,0); }
        86% { transform: translate(5px,-9px); }
        94% { transform: translate(0,0); }
      }
      @keyframes ear-bob { 0%,100% { transform: rotate(0deg); } 45% { transform: rotate(4deg); } 75% { transform: rotate(-3deg); } }
      @keyframes grass-sway { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
      @media (prefers-reduced-motion: reduce) {
        .cloud, .breeze, .bunny, .ears, .grass { animation: none; }
      }
    </style>
  </defs>

  <rect width="900" height="180" rx="13" fill="url(#sky)"/>
  <circle cx="790" cy="35" r="17" fill="#ffe7a8" opacity=".88"/>
  <g fill="#fff" opacity=".9" class="cloud">
    <path d="M120 43c-1-7 5-13 13-13 4-10 19-11 25-1 9-1 15 5 15 13 0 6-5 10-13 10h-27c-8 0-13-3-13-9z"/>
  </g>
  <g fill="#fff" opacity=".72" class="cloud second">
    <path d="M620 57c0-6 5-10 11-10 4-8 15-9 20-1 7-1 12 4 12 10 0 5-4 8-10 8h-23c-6 0-10-2-10-7z"/>
  </g>

  <g fill="none" stroke="#8fc5bd" stroke-linecap="round" stroke-width="2.2" opacity=".75">
    <path class="breeze" d="M220 72c15-8 27 7 43 0 8-4 12-8 21-6"/>
    <path class="breeze two" d="M548 38c12-6 22 6 35 0 6-3 10-6 16-5"/>
    <path class="breeze" d="M690 84c10-5 19 5 30 0 5-2 8-5 13-4" opacity=".65"/>
  </g>

  <path d="M0 123c105-24 172-4 264-8s154-32 255-14 191 10 381-9v88H0z" fill="#d7edc9"/>
  <path d="M0 139c104-22 205-5 302-9s155-20 250-6 209 7 348-8v64H0z" fill="#bfe4ad"/>
  <path d="M0 145c122-12 225-4 338-6s215-20 325-7 169 6 237 1v47H0z" fill="url(#meadow)"/>

  <g fill="none" stroke="#74b86e" stroke-width="2" stroke-linecap="round">
    <path d="M64 157l-4-13m4 13 6-10m-6 10-10-7"/>
    <path d="M165 164l-2-13m2 13 8-11m-8 11-9-5"/>
    <path d="M302 160l-3-15m3 15 7-12m-7 12-9-6"/>
    <path d="M620 165l-3-14m3 14 8-12m-8 12-8-5"/>
    <path d="M822 160l-2-15m2 15 7-10m-7 10-9-6"/>
  </g>

  <g class="bunny">
    <ellipse cx="438" cy="119" rx="25" ry="18" fill="#fffdf9" stroke="#d7ded6" stroke-width="1.4"/>
    <ellipse cx="424" cy="132" rx="12" ry="5.5" fill="#fffdf9" stroke="#d7ded6" stroke-width="1.2"/>
    <circle cx="412" cy="113" r="7" fill="#fffdf9" stroke="#d7ded6" stroke-width="1.2"/>
    <path d="M446 105c-6-13-7-28-1-34 5-5 10 4 11 13l2 20z" fill="#fffdf9" stroke="#d7ded6" stroke-width="1.2"/>
    <path d="M449 100c-4-10-4-18-1-22 3 4 4 12 4 21z" fill="#f4b9c8"/>
    <g class="ears">
      <path d="M454 92c-1-16 4-31 11-31 7 1 7 14 3 31z" fill="#fffdf9" stroke="#d7ded6" stroke-width="1.2"/>
      <path d="M459 88c0-12 3-20 6-21 3 5 2 13 0 21z" fill="#f4b9c8"/>
    </g>
    <circle cx="462" cy="101" r="15" fill="#fffdf9" stroke="#d7ded6" stroke-width="1.3"/>
    <ellipse cx="471" cy="105" rx="2.5" ry="2" fill="#e9a1b6"/>
    <circle cx="466" cy="98" r="2.1" fill="#554b4b"/>
    <circle cx="466.7" cy="97.2" r=".65" fill="#fff"/>
    <ellipse cx="458" cy="104" rx="3.3" ry="2" fill="#f6c7cf" opacity=".8"/>
    <path d="M471 106q-2 3-5 2" fill="none" stroke="#a88487" stroke-width="1" stroke-linecap="round"/>
    <path d="M474 105l7-2m-7 5 7 1" fill="none" stroke="#c5b6b6" stroke-width=".8" stroke-linecap="round"/>
  </g>

  <g fill="#fff0fa">
    <circle cx="95" cy="145" r="2.6"/><circle cx="90" cy="142" r="2.5"/><circle cx="100" cy="142" r="2.5"/><circle cx="95" cy="139" r="2.5"/>
    <circle cx="95" cy="142" r="1.7" fill="#f4c96b"/>
    <circle cx="730" cy="152" r="2.5"/><circle cx="725" cy="149" r="2.3"/><circle cx="735" cy="149" r="2.3"/><circle cx="730" cy="146" r="2.3"/>
    <circle cx="730" cy="149" r="1.6" fill="#f4c96b"/>
  </g>
  <g fill="none" stroke="#65ae65" stroke-width="2" stroke-linecap="round">
    <path d="M96 158v-12m0 6-5-4m5 6 5-4"/>
    <path d="M731 166v-14m0 6-5-4m5 6 5-4"/>
  </g>

  <g class="grass" fill="none" stroke="#5eaa61" stroke-width="2.4" stroke-linecap="round">
    <path d="M386 180l-4-23m4 23 7-16m-7 16-10-11"/>
    <path d="M405 180l1-18m-1 18-7-10"/>
  </g>
  <g class="grass delay" fill="none" stroke="#4fa15b" stroke-width="2.6" stroke-linecap="round">
    <path d="M454 180l-1-19m1 19 8-14m-8 14-9-9"/>
    <path d="M482 180l4-24m-4 24-8-13"/>
  </g>
  <g fill="#6bb86a">
    <ellipse cx="397" cy="171" rx="6" ry="2.5" transform="rotate(-24 397 171)"/>
    <ellipse cx="471" cy="173" rx="7" ry="2.5" transform="rotate(22 471 173)"/>
  </g>
</svg>