name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lesbunny
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Turn the moving snake into Pac-Man
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Pac-Man follows only the original leading-snake route.
          # The ghosts have their own routes so they do not form another snake.
          mask = """<defs>
          <mask id="pacmanMouthMask" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
            <circle cx="8" cy="8" r="7.4" fill="white"/>
            <path d="M8 8 L16 3.2 L16 12.8 Z" fill="black">
              <animate attributeName="d" dur="0.28s" repeatCount="indefinite"
                values="M8 8 L16 3.2 L16 12.8 Z;M8 8 L16 7.7 L16 8.3 Z;M8 8 L16 3.2 L16 12.8 Z"/>
            </path>
          </mask>
          </defs>"""

          pacman = """<g class="pacmanRoute">
            <g class="pacmanFacing">
              <circle class="pacmanBody" cx="8" cy="8" r="7.4" mask="url(#pacmanMouthMask)"/>
              <circle class="pacmanEye" cx="9.5" cy="3.5" r="0.9"/>
            </g>
          </g>"""

          def ghost(route_class):
              return f"""<g class="{route_class}">
                <g class="ghostBob">
                  <path class="ghostBody" d="M2 13V6.5a5 5 0 0 1 10 0V13L9.5 11L7 13L4.5 11Z"/>
                  <circle class="ghostEye" cx="5" cy="6.2" r="1.7"/>
                  <circle class="ghostEye" cx="9" cy="6.2" r="1.7"/>
                  <circle class="ghostPupil" cx="5.5" cy="6.2" r=".72"/>
                  <circle class="ghostPupil" cx="9.5" cy="6.2" r=".72"/>
                </g>
              </g>"""

          characters = mask + pacman + ghost("ghostRoute1") + ghost("ghostRoute2") + ghost("ghostRoute3")

          # The dots retain the normal green GitHub contribution palette.
          # Give cells a clearer outline, but do not recolor them with the earlier pride-wave effect.
          for path in Path("dist").glob("github-snake*.svg"):
              svg = path.read_text(encoding="utf-8")
              dark = path.name.endswith("-dark.svg")
              outline = "#8cbda6" if dark else "#98b5a1"

              svg, replaced = re.subn(
                  r'\.c\{shape-rendering:geometricPrecision;fill:var\(--ce\);stroke-width:1px;stroke:var\(--cb\);',
                  f'.c{{shape-rendering:geometricPrecision;fill:var(--ce);stroke-width:1.1px;stroke:{outline};stroke-opacity:.8;',
                  svg,
                  count=1,
              )
              if replaced != 1:
                  raise SystemExit(f"Could not set visible green dot outlines in {path}")

              if "</style>" not in svg or not svg.endswith("</svg>"):
                  raise SystemExit(f"Unexpected SVG structure in {path}")

              css = """
              /* Hide only the original four-piece snake; the contribution dots stay green. */
              rect.s{opacity:0}
              .pacmanRoute{animation:s0 14500ms linear infinite}
              .pacmanFacing{transform-box:fill-box;transform-origin:center;animation:pacmanFacing 14500ms steps(1,end) infinite}
              .pacmanBody{fill:#ffdc28;stroke:#b77c00;stroke-width:.85px}
              .pacmanEye{fill:#211526;stroke:none}
              .pacmanMouthCut{fill:black}
              .ghostRoute1{animation:ghostRoute1 14500ms linear infinite}
              .ghostRoute2{animation:ghostRoute2 14500ms linear infinite}
              .ghostRoute3{animation:ghostRoute3 14500ms linear infinite}
              .ghostBob{animation:ghostBob .32s steps(2,end) infinite}
              .ghostBody{fill:#2121de;stroke:#101087;stroke-width:.8px;stroke-linejoin:round}
              .ghostEye{fill:white;stroke:none}
              .ghostPupil{fill:#10104d;stroke:none}
              @keyframes ghostBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.55px)}}
              /* Frightened blue ghosts roam separately around the grid while Pac-Man follows the snake route. */
              @keyframes ghostRoute1{
                0%{transform:translate(224px,0)}12%{transform:translate(400px,0)}
                17%{transform:translate(400px,32px)}28%{transform:translate(560px,32px)}
                34%{transform:translate(560px,80px)}44%{transform:translate(736px,80px)}
                50%{transform:translate(736px,48px)}60%{transform:translate(640px,48px)}
                68%{transform:translate(640px,16px)}80%{transform:translate(352px,16px)}
                88%{transform:translate(352px,64px)}95%{transform:translate(224px,64px)}
                100%{transform:translate(224px,0)}
              }
              @keyframes ghostRoute2{
                0%{transform:translate(800px,96px)}8%{transform:translate(800px,48px)}
                18%{transform:translate(704px,48px)}25%{transform:translate(704px,0)}
                36%{transform:translate(512px,0)}42%{transform:translate(512px,32px)}
                53%{transform:translate(384px,32px)}61%{transform:translate(384px,80px)}
                72%{transform:translate(256px,80px)}78%{transform:translate(256px,48px)}
                88%{transform:translate(112px,48px)}94%{transform:translate(112px,96px)}
                100%{transform:translate(800px,96px)}
              }
              @keyframes ghostRoute3{
                0%{transform:translate(80px,32px)}10%{transform:translate(208px,32px)}
                17%{transform:translate(208px,80px)}29%{transform:translate(400px,80px)}
                35%{transform:translate(400px,48px)}45%{transform:translate(528px,48px)}
                52%{transform:translate(528px,96px)}63%{transform:translate(688px,96px)}
                69%{transform:translate(688px,64px)}79%{transform:translate(816px,64px)}
                85%{transform:translate(816px,16px)}93%{transform:translate(592px,16px)}
                100%{transform:translate(80px,32px)}
              }
              /* Turn Pac-Man to face the direction of travel along the original snake route. */
              @keyframes pacmanFacing{
                0%,.68%{transform:rotate(90deg)}
                .69%,10.33%{transform:rotate(0deg)}
                10.34%,11.71%{transform:rotate(90deg)}
                11.72%,16.54%{transform:rotate(0deg)}
                16.55%,18.61%{transform:rotate(90deg)}
                18.62%,24.82%{transform:rotate(0deg)}
                24.83%,26.20%{transform:rotate(-90deg)}
                26.21%,33.78%{transform:rotate(0deg)}
                33.79%,35.85%{transform:rotate(90deg)}
                35.86%,37.92%{transform:rotate(0deg)}
                37.93%,41.37%{transform:rotate(-90deg)}
                41.38%,46.20%{transform:rotate(0deg)}
                46.21%,48.27%{transform:rotate(90deg)}
                48.28%,48.96%{transform:rotate(0deg)}
                48.97%,49.65%{transform:rotate(90deg)}
                49.66%,50.33%{transform:rotate(0deg)}
                50.34%,53.78%{transform:rotate(-90deg)}
                53.79%,54.47%{transform:rotate(180deg)}
                54.48%,56.54%{transform:rotate(90deg)}
                56.55%,57.23%{transform:rotate(180deg)}
                57.24%,59.30%{transform:rotate(90deg)}
                59.31%,82.75%{transform:rotate(180deg)}
                82.76%,83.44%{transform:rotate(-90deg)}
                83.45%,84.13%{transform:rotate(180deg)}
                84.14%,84.82%{transform:rotate(-90deg)}
                84.83%,89.65%{transform:rotate(180deg)}
                89.66%,91.71%{transform:rotate(-90deg)}
                91.72%,92.40%{transform:rotate(180deg)}
                92.41%,93.09%{transform:rotate(-90deg)}
                93.1%,95.16%{transform:rotate(180deg)}
                95.17%,95.85%{transform:rotate(-90deg)}
                95.86%,100%{transform:rotate(180deg)}
              }
              """
              svg = svg.replace("</style>", css + "</style>", 1)
              svg = svg[:-6] + characters + "</svg>"
              path.write_text(svg, encoding="utf-8")
              print(f"Styled {path}: preserved green dots, Pac-Man on the snake route, 3 independent blue ghosts")
          PY

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
