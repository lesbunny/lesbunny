name: Generate GitHub Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lesbunny
          outputs: |
            dist/github-pacman.svg
            dist/github-pacman-dark.svg?palette=github-dark

      - name: Build a Pac-Man game loop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TOTAL = 40.0
          SWEEP_START = 14.0
          SWEEP_LENGTH = 19.5
          COLS = 53
          ROWS = 7
          def pct(seconds):
              return f"{seconds / TOTAL:.6f}".rstrip("0").rstrip(".")

          def route_markup(route, css_name=None):
              keys = ";".join(pct(t) for t, _c, _r in route)
              values = ";".join(f"{c*16} {r*16}" for _t, c, r in route)
              return (
                  f'<animateTransform attributeName="transform" type="translate" '
                  f'dur="{TOTAL}s" repeatCount="indefinite" calcMode="linear" '
                  f'keyTimes="{keys}" values="{values}"/>'
              )

          # Pac-Man first chases each ghost to its capture point.
          hunt = [
              (0.0,0,0), (1.0,2,0), (2.0,5,0), (3.0,8,0), (4.0,10,0),
              (5.0,10,1), (5.4,11,1), (6.0,14,1), (6.3,15,1), (6.8,15,2),
              (7.2,18,2), (7.7,21,2), (8.2,23,2), (8.6,24,2), (9.0,24,4),
              (9.2,25,4), (10.0,28,4), (10.3,29,4), (11.0,30,4),
              (11.6,30,5), (12.0,30,5), (12.4,30,4), (12.8,30,2),
              (13.1,20,2), (13.4,10,2), (13.7,0,2), (13.9,0,0)
          ]
          pac_route = [(t,c,r) for t,c,r in hunt]
          sweep = []
          for row in range(ROWS):
              columns = range(COLS) if row % 2 == 0 else range(COLS-1, -1, -1)
              for col in columns:
                  sweep.append((SWEEP_START + len(sweep) * SWEEP_LENGTH / (COLS*ROWS-1), col, row))
          pac_route.extend(sweep)
          pac_route.append((TOTAL, COLS-1, ROWS-1))

          # Determine discrete facing changes from each consecutive route segment.
          facing = []
          previous = None
          for i in range(len(pac_route)-1):
              t, c, r = pac_route[i]
              _nt, nc, nr = pac_route[i+1]
              dx, dy = nc-c, nr-r
              if dx == 0 and dy == 0:
                  continue
              angle = (0 if dx > 0 else 180) if abs(dx) >= abs(dy) and dx else (90 if dy > 0 else 270)
              if angle != previous:
                  facing.append((t, angle))
                  previous = angle
          if not facing or facing[0][0] != 0:
              facing.insert(0, (0.0, 0))
          facing.append((TOTAL, 0))
          # Remove duplicate times and ensure the first/last SMIL keyTime is 0/1.
          cleaned = []
          for item in facing:
              if cleaned and abs(cleaned[-1][0] - item[0]) < 0.000001:
                  cleaned[-1] = item
              else:
                  cleaned.append(item)
          facing = cleaned

          pacman = (
              '<g id="pacman" aria-label="Pac-Man">'
              + route_markup(pac_route)
              + '<g class="pacmanFacing">'
              + '<path class="pacmanBody" fill="#ffdc28" stroke="#b77c00" stroke-width=".8" '
                'd="M8 8 L14.8 3 A7.7 7.7 0 1 0 14.8 13 Z">'
              + '<animate attributeName="d" dur=".30s" repeatCount="indefinite" calcMode="linear" '
                'values="M8 8 L14.8 3 A7.7 7.7 0 1 0 14.8 13 Z;'
                'M8 8 L15.4 7.4 A7.4 7.4 0 1 0 15.4 8.6 Z;'
                'M8 8 L14.8 3 A7.7 7.7 0 1 0 14.8 13 Z"/>'
              + '</path><circle class="pacmanEye" cx="9.5" cy="3.9" r=".85" fill="#211526"/>'
              + '<animateTransform attributeName="transform" type="rotate" dur="40s" repeatCount="indefinite" '
                'calcMode="discrete" keyTimes="' + ";".join(pct(t) for t,_a in facing) + '" '
                'values="' + ";".join(f"{a} 8 8" for _t,a in facing) + '"/>'
              + '</g></g>'
          )

          ghost_art = """<g class="ghostIcon">
            <path class="ghostBody" d="M1.5 13.5V6.7a5.5 5.5 0 0 1 11 0v6.8l-2.75-2-2.75 2-2.75-2z"
              fill="#2121de" stroke="#11115f" stroke-width=".75" stroke-linejoin="round"/>
            <circle cx="5" cy="6.5" r="1.7" fill="#fff"/>
            <circle cx="9.2" cy="6.5" r="1.7" fill="#fff"/>
            <circle cx="5.5" cy="6.5" r=".72" fill="#14144d"/>
            <circle cx="9.7" cy="6.5" r=".72" fill="#14144d"/>
            <animateTransform attributeName="transform" type="translate" additive="sum" dur=".36s"
              repeatCount="indefinite" values="0 0;0 -.45;0 0"/>
          </g>"""

          ghost_routes = {
              "ghost1": [
                  (0,8,0),(1,10,0),(2,12,0),(3,12,2),(4,10,2),(4.6,10,1),
                  (5,10,1),(5.5,8,1),(6,8,0),(40,8,0)
              ],
              "ghost2": [
                  (0,18,2),(2,20,2),(4,22,2),(6.5,24,2),(7.2,25,2),
                  (7.8,25,3),(8.4,25,4),(9,24,4),(10,20,4),(12,18,4),(40,18,2)
              ],
              "ghost3": [
                  (0,28,5),(1.5,30,5),(3,32,5),(5,32,4),(7,31,4),
                  (9,30,4),(10.5,30,5),(12,30,5),(13,28,5),(40,28,5)
              ]
          }
          catch_time = {"ghost1":5.0, "ghost2":9.0, "ghost3":12.0}
          ghosts = []
          for name, points in ghost_routes.items():
              caught = catch_time[name]
              # Flash at contact, vanish after being eaten, and return at the next-level loop.
              fade_keys = [0, max(0, caught-.10), caught, caught+.10, caught+.25, 39.6, 40]
              fade_keys = [max(0,min(TOTAL,t)) for t in fade_keys]
              # Enforce strictly increasing timing values; points are deliberately separated.
              for i in range(1, len(fade_keys)):
                  if fade_keys[i] <= fade_keys[i-1]:
                      fade_keys[i] = fade_keys[i-1] + .001
              key_times = ";".join(pct(t) for t in fade_keys)
              fade_anim = (
                  f'<animate attributeName="opacity" dur="{TOTAL}s" repeatCount="indefinite" '
                  f'calcMode="linear" keyTimes="{key_times}" values="1;1;0.25;1;0;0;1"/>'
              )
              ghosts.append(
                  f'<g id="{name}" aria-label="Frightened blue ghost">'
                  + route_markup(points)
                  + '<g class="ghostIcon">' + ghost_art + fade_anim + '</g></g>'
              )

          css = """
          /* Green contribution dots remain the collectibles. Their opacity is animated below. */
          .c{animation:none !important;stroke-width:1.1px;stroke:#789b86;stroke-opacity:.85}
          .pacmanEye{stroke:none}
          .winDim{fill:#070812;fill-opacity:.91}
          .winPanel{fill:#14172d;stroke:#ffdc28;stroke-width:2}
          .winTitle{font:700 25px monospace;fill:#ffdc28;letter-spacing:2px;text-anchor:middle}
          .winSub{font:700 15px monospace;fill:#fff;text-anchor:middle}
          .winBlink{font:700 13px monospace;fill:#ff7ac8;text-anchor:middle}
          """

          win = """<g id="winScreen">
            <rect class="winDim" x="-16" y="-32" width="880" height="192" rx="0"/>
            <rect class="winPanel" x="214" y="7" width="420" height="96" rx="7"/>
            <text class="winTitle" x="424" y="39">LEVEL CLEARED!</text>
            <text class="winSub" x="424" y="64">NEXT LEVEL ▶</text>
            <text class="winBlink" x="424" y="86">READY?</text>
            <animate attributeName="opacity" dur="40s" repeatCount="indefinite" calcMode="linear"
              keyTimes="0;0.8425;0.85;0.985;1" values="0;0;1;1;0"/>
          </g>"""

          for path in Path("dist").glob("github-pacman*.svg"):
              svg = path.read_text(encoding="utf-8")
              dark = path.name.endswith("-dark.svg")
              outline = "#a7c5b3" if dark else "#789b86"

              # Remove the generator's original snake and its eat-progress bars.
              svg, tails = re.subn(r'<rect class="s s[0-3]"[^>]*/>', "", svg)
              svg = re.sub(r'<rect class="u u\d+"[^>]*/>', "", svg)
              if tails != 4:
                  raise SystemExit(f"Expected four source snake pieces in {path}; removed {tails}")

              # Make the small contribution cells visible, and animate each dot being eaten in the sweep.
              cell_re = re.compile(
                  r'<rect class="(c[^"]*)" x="([0-9.]+)" y="([0-9.]+)" rx="2" ry="2"/>'
              )
              def style_cell(m):
                  cls, xs, ys = m.groups()
                  col = round((float(xs)-2)/16)
                  row = round((float(ys)-2)/16)
                  col = max(0,min(COLS-1,col))
                  row = max(0,min(ROWS-1,row))
                  index = row*COLS + (col if row % 2 == 0 else COLS-1-col)
                  eat_at = SWEEP_START + index*SWEEP_LENGTH/(COLS*ROWS-1)
                  end_at = min(eat_at + .08, 33.75)
                  keys = f"0;{pct(eat_at)};{pct(end_at)};0.99;1"
                  animation = (
                      f'<animate attributeName="opacity" dur="{TOTAL}s" repeatCount="indefinite" '
                      f'calcMode="linear" keyTimes="{keys}" values="1;1;0;0;1"/>'
                  )
                  return (
                      f'<rect class="{cls}" x="{xs}" y="{ys}" rx="2" ry="2" '
                      f'stroke="{outline}" stroke-width="1.05" stroke-opacity=".9">'
                      + animation + '</rect>'
                  )
              svg, cells = cell_re.subn(style_cell, svg)
              if cells < 300:
                  raise SystemExit(f"Expected hundreds of contribution dots in {path}; found {cells}")

              # Add a level-complete / next-level screen that resets on the 40-second loop.
              if "</style>" not in svg or not svg.endswith("</svg>"):
                  raise SystemExit(f"Unexpected SVG structure in {path}")
              theme_css = css.replace("#789b86", outline)
              svg = svg.replace("</style>", theme_css + "</style>", 1)
              svg = svg[:-6] + pacman + "".join(ghosts) + win + "</svg>"
              path.write_text(svg, encoding="utf-8")
              print(f"Built {path}: Pac-Man chases 3 ghosts, sweeps {cells} dots, shows NEXT LEVEL, then loops")
          PY

      - name: Publish Pac-Man game
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
